name: Build he-locale image

on:
  push:
    branches: [he-locale]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/documenso-he:latest
            ghcr.io/${{ github.repository_owner }}/documenso-he:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/documenso-he.tar
          tags: documenso-he:latest
          cache-from: type=gha

      - run: gzip -1 /tmp/documenso-he.tar

      - uses: actions/upload-artifact@v4
        with:
          name: documenso-he-image
          path: /tmp/documenso-he.tar.gz
          retention-days: 2
